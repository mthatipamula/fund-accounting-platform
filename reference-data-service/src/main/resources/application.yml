spring:
  application.name: reference-data-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/refdata}
    username: ${DATABASE_USER:refdata}
    password: ${DATABASE_PASSWORD:refdata}
    hikari.maximum-pool-size: 10
  grpc.server.port: ${GRPC_PORT:9090}
  servlet.multipart.max-file-size: 10MB
  threads.virtual.enabled: true   # Java 21 virtual threads for request handling

server:
  port: ${PORT:8081}
  shutdown: graceful

platform.security:
  issuer: ${OIDC_ISSUER:http://localhost:8180/realms/fund-accounting}
  jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/fund-accounting/protocol/openid-connect/certs}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
  opentelemetry.tracing.export.otlp.endpoint: ${OTLP_TRACES:http://localhost:4318/v1/traces}
  otlp.metrics.export.url: ${OTLP_METRICS:http://localhost:4318/v1/metrics}
