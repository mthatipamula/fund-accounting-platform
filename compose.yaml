# Local stack. First run: ./scripts/init-env.sh && docker compose up -d --build && node scripts/seed.mjs
name: fund-accounting

x-service-env: &service-env
  OIDC_ISSUER: http://localhost:8180/realms/fund-accounting          # what tokens say (the browser's view)
  OIDC_JWKS_URI: http://keycloak:8080/realms/fund-accounting/protocol/openid-connect/certs
  KAFKA_BOOTSTRAP: kafka:9092
  OTLP_TRACES: http://otel-lgtm:4318/v1/traces
  OTLP_METRICS: http://otel-lgtm:4318/v1/metrics

x-healthcheck: &actuator-health
  test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/$${PORT}' || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 40

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh}
      DB_PASSWORD_REFDATA: ${DB_PASSWORD_REFDATA}
      DB_PASSWORD_TRADES: ${DB_PASSWORD_TRADES}
      DB_PASSWORD_ACCOUNTING: ${DB_PASSWORD_ACCOUNTING}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:8180", "--hostname-backchannel-dynamic=true", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      WEB_ORIGIN: http://localhost:5173
      SEEDER_CLIENT_SECRET: ${SEEDER_CLIENT_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_ACCOUNTANT_PASSWORD: ${DEMO_ACCOUNTANT_PASSWORD}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD}
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  otel-lgtm:   # Grafana + Tempo (traces) + Mimir (metrics) + Loki (logs), one container for local use
    image: grafana/otel-lgtm:0.11.10
    ports: ["127.0.0.1:3000:3000"]

  reference-data-service:
    build: { context: ., args: { MODULE: reference-data-service } }
    environment:
      <<: *service-env
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/refdata
      DATABASE_USER: refdata
      DATABASE_PASSWORD: ${DB_PASSWORD_REFDATA}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *actuator-health
    ports: ["127.0.0.1:8081:8081"]

  trade-service:
    build: { context: ., args: { MODULE: trade-service } }
    environment:
      <<: *service-env
      PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/trades
      DATABASE_USER: trades
      DATABASE_PASSWORD: ${DB_PASSWORD_TRADES}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck: *actuator-health
    ports: ["127.0.0.1:8082:8082"]

  accounting-service:
    build: { context: ., args: { MODULE: accounting-service } }
    environment:
      <<: *service-env
      PORT: 8083
      DATABASE_URL: jdbc:postgresql://postgres:5432/accounting
      DATABASE_USER: accounting
      DATABASE_PASSWORD: ${DB_PASSWORD_ACCOUNTING}
      REFDATA_GRPC: static://reference-data-service:9090
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      reference-data-service: { condition: service_started }
    healthcheck: *actuator-health
    ports: ["127.0.0.1:8083:8083"]

  gateway:
    build: { context: ., args: { MODULE: gateway } }
    environment:
      <<: *service-env
      PORT: 8080
      REFDATA_URL: http://reference-data-service:8081
      TRADES_URL: http://trade-service:8082
      ACCOUNTING_URL: http://accounting-service:8083
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck: *actuator-health
    ports: ["127.0.0.1:8080:8080"]

  web:
    build: { context: ./web }
    depends_on: [gateway]
    ports: ["127.0.0.1:5173:8080"]

volumes:
  pgdata:
