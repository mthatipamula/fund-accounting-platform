spring:
  application.name: gateway
  cloud.gateway.server.webflux:
    routes:
      - id: reference-data
        uri: ${REFDATA_URL:http://localhost:8081}
        predicates: [Path=/api/reference/**]
      - id: trades
        uri: ${TRADES_URL:http://localhost:8082}
        predicates: [Path=/api/trades/**]
      - id: accounting
        uri: ${ACCOUNTING_URL:http://localhost:8083}
        predicates: [Path=/api/accounting/**]
    default-filters:
      - name: Retry            # reads only; writes are never retried by the gateway
        args: { retries: 2, methods: GET, statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE }
    httpclient:
      connect-timeout: 3000
      response-timeout: 60s

server:
  port: ${PORT:8080}
  shutdown: graceful

platform.security:
  issuer: ${OIDC_ISSUER:http://localhost:8180/realms/fund-accounting}
  jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/fund-accounting/protocol/openid-connect/certs}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
  opentelemetry.tracing.export.otlp.endpoint: ${OTLP_TRACES:http://localhost:4318/v1/traces}
  otlp.metrics.export.url: ${OTLP_METRICS:http://localhost:4318/v1/metrics}
